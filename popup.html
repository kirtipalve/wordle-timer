<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wordle Timer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Wordle Timer</h1>
      <div id="user-info" class="hidden">
        <img id="user-photo" src="" alt="Profile">
        <span id="user-name"></span>
      </div>
    </header>

    <main>
      <!-- Loading state -->
      <div id="loading-section">
        <div class="loading-spinner"></div>
        <p>Loading...</p>
      </div>

      <!-- Auth section (shown when not signed in) -->
      <div id="auth-section" class="hidden">
        <div class="auth-message">
          <p>Sign in to submit your times and compete on the daily leaderboard!</p>
        </div>
        <button id="sign-in-btn" class="primary-btn">
          <svg class="google-icon" viewBox="0 0 24 24" width="18" height="18">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Sign in with Google
        </button>
      </div>

      <!-- Leaderboard section (shown when signed in) -->
      <div id="leaderboard-section" class="hidden">
        <div class="tabs">
          <button class="tab active" data-tab="today">Today</button>
          <button class="tab" data-tab="my-stats">My Stats</button>
        </div>

        <!-- Today's Leaderboard Tab -->
        <div id="today-tab" class="tab-content active">
          <div class="wordle-info">
            <span id="wordle-number">Wordle #---</span>
            <span id="your-time" class="hidden">Your time: --:--</span>
          </div>

          <div class="region-picker">
            <label for="region-select">Leaderboard region</label>
            <div class="region-control">
              <select id="region-select"></select>
              <span id="region-label" class="region-label"></span>
            </div>
          </div>

          <div id="leaderboard-list">
            <div class="loading-inline">Loading leaderboard...</div>
          </div>

          <div id="your-rank" class="hidden">
            Your rank: <span id="rank-number">--</span>
          </div>

          <div id="no-submission" class="hidden">
            <p>Complete today's Wordle to appear on the leaderboard!</p>
          </div>
        </div>

        <!-- My Stats Tab -->
        <div id="my-stats-tab" class="tab-content hidden">
          <div class="stats-grid">
            <div class="stat-card">
              <span class="stat-value" id="total-games">0</span>
              <span class="stat-label">Games Played</span>
            </div>
            <div class="stat-card">
              <span class="stat-value" id="avg-time">--:--</span>
              <span class="stat-label">Average Time</span>
            </div>
            <div class="stat-card">
              <span class="stat-value" id="best-time">--:--</span>
              <span class="stat-label">Best Time</span>
            </div>
          </div>
        </div>

        <button id="sign-out-btn" class="secondary-btn">Sign Out</button>
      </div>

      <!-- Error state -->
      <div id="error-section" class="hidden">
        <p id="error-message">An error occurred.</p>
        <button id="retry-btn" class="secondary-btn">Retry</button>
      </div>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
